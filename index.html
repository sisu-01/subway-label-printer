<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>써브웨이</title>
</head>
<body style="background-color: #006229;">
    <div id="root">
    </div>
</body>
<script type="text/babel">
    // 메뉴
    const menu = {
        "로스트치킨": 2,
        "달걀": 2,
        "쉬림프": 1.5,
        "스파이시 쉬림프": 1,
        "햄": 2,
        "살라미": 3,
        "페페로니": 3,
        "치킨 데리야키": 2,
        "풀드포크": 2,
        "참치": 3,
        "베이컨": 5,
        "치슬": 2,
        "로티세리": 2,
        "스테이크": 2,
        "안창살": 2,
        "에그마요": 3,
        "오믈렛": 3,
        "또띠아": 0.5,
        "비츠": 5,
        "스프": 2,
    }
    const vegie = {
        "양상추": 2,
        "토마토": 2,
        "오이": 2,
        "양파": 2,
        "피망": 2,
        "피클": 5,
        "올리브": 5,
        "할라피뇨": 5,
        "아보카도": 1,
        "머쉬룸": 1,
    }
    const sauce = {
        "랜치": 5,
        "스·칠": 5,
        "스·어": 5,
        "BBQ": 5,
        "허·머": 5,
        "핫칠리": 5,
        "마요네즈": 5,
        "머스타드": 5,
        "치폴레": 5,
        "홀스레디쉬": 5,
        "오일": 5,
        "식초": 5,
    }
    const cheese = {
        "모짜렐라": 5,
        "슈레드": 5,
        "아메리칸": 5,
        "콰트로": 2,
    }
    const thaw = {
        "햄": [2, 3],
        "살라미": [2, 3],
        "페퍼로니": [2, 3],
        "베이컨": [2, 5],
        "치슬": [2, 3],
        "스테이크": [2, 3],
        "풀드포크": [2, 3],
        "로스트치킨": [2, 3],
        "치킨스트립": [2, 3],
        "로티세리": [2, 3],
        "오믈렛": [1, 4],
        "아보카도": [2, 14],
        "비츠": [1, 5],
        "스프": [2, 5],
        "소스": 14,
        "또띠아": 0.5,
        "플랫": 3,
    }
    const categories = [
        { title: "Menu", items: menu },
        { title: "Vegie", items: vegie },
        { title: "Sauce", items: sauce },
        { title: "Cheese", items: cheese },
        { title: "Thaw", items: thaw },
    ];

    const getTodayDateHour = () => {
        const today = new Date();
        const todayYear = today.getFullYear();
        const todayMonth = String(today.getMonth() + 1).padStart(2, "0");
        const todayDay = String(today.getDate()).padStart(2, "0");
        const formattedDate = `${todayYear}-${todayMonth}-${todayDay}`;
        
        const todayHour = today.getHours();
        const todayMinute = today.getMinutes();
        const roundedHour = todayMinute >= 30 ? todayHour + 1 : todayHour;
        //const formattedHours = roundedHour == 24? "00" : roundedHour % 24;
        const formattedHours = String(roundedHour % 24).padStart(2, "0"); // 2자리 형식으로 수정

        return { formattedDate, formattedHours };
    }

    const addDaysToDate = (dateString, timeString, daysToAdd) => {
        // 문자열을 Date 객체로 변환
        const dateTimeString = `${dateString}T${timeString}`;
        const date = new Date(dateTimeString);
        const hoursToAdd = daysToAdd * 24;

        date.setHours(date.getHours() + hoursToAdd);
        // 결과를 yyyy-mm-dd 형식으로 반환
        const month = String(date.getMonth() + 1).padStart(2, "0"); // 월은 0부터 시작
        const day = String(date.getDate()).padStart(2, "0");
        const hours = String(date.getHours()).padStart(2, "0");
        //const minutes = String(date.getMinutes()).padStart(2, "0");

        return [month, day, hours];//, minutes]; // 반환값 유지
    }

    const getDateFormat = (dateString) => {
        const now = new Date(dateString);
        const startMonth = String(now.getMonth() + 1).padStart(2, "0");
        const startDay = String(now.getDate()).padStart(2, "0");

        return { startMonth, startDay };
    }

    const getTimeFormat = (timeString) => {
        const hours = timeString.split(":")[0];
        const period = hours < 12 ? "A" : "P";
        const formattedHours = hours % 12 === 0 ? 12 : hours % 12;

        return [ period, formattedHours ];
    }

    const useLabelData = () => {
        const { formattedDate, formattedHours } = getTodayDateHour();
        const [date, setDate] = React.useState(formattedDate);
        const [time, setTime] = React.useState(`${formattedHours}:00`);
        const [name, setName] = React.useState("");
        return { date, setDate, time, setTime, name, setName };
    };

    //App
    const App = () => {
        const { date, setDate, time, setTime, name, setName } = useLabelData();

        const printDiv = (item, itemDate) => {
            let midMonth="", midDay="", midPeriod="", midHour="", midMin="";
            let endMonth, endDay, endPeriod, endHour, endMin;
		console.log(itemDate);
            if (typeof itemDate !== "number") {
                [ midMonth, midDay, midHour ] = addDaysToDate(date, time, itemDate[0]);
                [ endMonth, endDay, endHour ] = addDaysToDate(date, time, itemDate[0]+itemDate[1]);
                [ midPeriod, midHour ] = getTimeFormat(`${midHour}:00`);
                [ endPeriod, endHour ] = getTimeFormat(`${endHour}:00`);
            } else {
                [ endMonth, endDay, endHour ]  = addDaysToDate(date, time, itemDate);
                [ endPeriod, endHour ] = getTimeFormat(`${endHour}:00`);
            }
            if (!name) {
                alert("준비자를 입력해주세요.");
                return false;
            }
            const { startMonth, startDay } = getDateFormat(date);
            const [ startPeriod, startHour ] = getTimeFormat(time);
            
            // 출력할 내용을 가져오기
            let divToPrint = `
                <div class="label flip">
                    <div class="empty">
                    </div>
                    <div>
                        <div class="div item center">${item}</div>
                        <div class="div date">
                            <div class="center">${startMonth}</div>
                            <div class="center">${startDay}</div>
                            <div class="right">${startPeriod}&nbsp;</div>
                            <div>&nbsp;${startHour}</div>
                        </div>
                        <div class="div date">
                            <div class="center">${midMonth}</div>
                            <div class="center">${midDay}</div>`;
                            if (startPeriod !== midPeriod || startHour !== midHour ) {
                                divToPrint += `
                                    <div class="right">${midPeriod}&nbsp;</div>
                                    <div>&nbsp;${midHour}</div>
                                `;
                            }
            divToPrint += `</div>
                        <div class="div date">
                            <div class="center">${endMonth}</div>
                            <div class="center">${endDay}</div>`;
                            if (startPeriod !== endPeriod || startHour !== endHour ) {
                                divToPrint += `
                                    <div class="right">${endPeriod}&nbsp;</div>
                                <div>&nbsp;${endHour}</div>
                                `;
                            }
            divToPrint += `</div>
                        <div class="div center">
                            ${name}
                        </div>
                    </div>
                </div>
            `;
            const style = `
                <style>
                    body {
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        box-sizing: border-box;
                    }
                    .label {
                        display: grid;
                        grid-template-columns: 1.6cm 1fr;
                        padding: 0.15cm;
                        width: 5cm;
                        height: 3cm;
                        font-family: Arial, sans-serif;
                        box-sizing: border-box; /* 크기 고정 */
                    }
                    .div {
                        align-content: center;
                        height: 0.54cm;
                    }
                    .center {
                        text-align: center;
                    }
                    .right {
                        text-align: right;
                    }
                    .date {
                        display: grid;
                        grid-template-columns: 0.7cm 1fr 1fr 0.9cm;
                    }
                    .flip {
                        transform: rotate(180deg);
                        transform-origin: center; /* 회전 중심을 중앙으로 설정 */
                    }
                </style>
            `;
            // 새 창 열기
            const newWindow = window.open("", "_blank");
            // 새 창에 출력할 HTML 작성
            newWindow.document.write(`
                <html>
                    <head>
                        <title>Print Label</title>
                        ${style}
                    </head>
                    <body onload="window.print(); window.close();">
                        ${divToPrint}
                    </body>
                </html>
            `);
            // 새 창 닫기
            newWindow.document.close();
        }

        return (
            <div className="App">
                <div className="header">
                    <h1>
                        <span className="sub">SUB</span>
                        <span className="way">WAY Label 출력기</span>
                    </h1>
                </div>
                <div className="content">
                    <div className="zz">
                        <div className="logoWrapper">
                            <div className="aa">
                                <LabelDate date={date} setDate={setDate} />
                                <LabelTime time={time} setTime={setTime} />
                                <LabelName name={name} setName={setName} />
                            </div>
                            <div className="dd">
                                <div className="imgDiv">
                                    <img src="https://i.imgur.com/iSqfJAb.png" alt="로고" />
                                </div>
                            </div>
                        </div>
                        <div className="bb">
                            <Item printDiv={printDiv} />
                        </div>
                    </div>
                </div>
            </div>
        )
    }

    const Item = (props) => {
        const { printDiv } = props;

        return (
            <div className="Item">
                {categories.map((category, idx) => (
                    <ButtonContainer key={idx} title={category['title']} printDiv={printDiv} json={category.items} />
                ))}
            </div>
        )
    }

    //Button container
    const ButtonContainer = (props) => {
        const { title, printDiv, json } = props;
        return (
            <div className="btn-container">
                {Object.keys(json).map((key) => (
                    <Button key={key} title={title} item={key} date={json[key]} printDiv={printDiv}/>
                ))}
            </div>
        )
    }

    //Button
    const Button = (props) => {
        const { title, item, date, printDiv } = props;
        
        const handleClick = () => {
            printDiv(item, date);
        };

        return (
            <div className={`btn ${title}`} onClick={handleClick}>
                {item}
            </div>
        )
    }

    const LabelDate = (props) => {
        const { date, setDate } = props;

        const handleChange = (e) => {
            setDate(e.target.value);
        };

        return (
            <input
                type="date"
                className="input-date"
                value={date}
                onChange={handleChange}
            />
        )
    }

    const LabelTime = (props) => {
        const { time, setTime } = props;

        const handleChange = (e) => {
            setTime(e.target.value);
        };

        return (
            <input
                type="time"
                className="input-time"
                value={time}
                onChange={handleChange}
            />
        )
    }

    const LabelName = (props) => {
        const { name, setName } = props;

        const handleChange = (e) => {
            setName(e.target.value);
        };

        return (
            <input
                type="text"
                className="input-name"
                value={name}
                onChange={handleChange}
                placeholder="준비자"
            />
        )
    }    

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
        <App />
    );
</script>
